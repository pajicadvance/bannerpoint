# general
mod.id = "bannerpoint"
mod.name = "Bannerpoint"
mod.group = "me.pajic"
mod.version = "1.1.2"
mod.description = "Turn banners into locator bar waypoints"
mod.authors = "pajic"
mod.contributors = ""
mod.license = "MIT"

# links
mod.sources_url = "https://github.com/pajicadvance/bannerpoint"
mod.homepage_url = "https://modrinth.com/mod/bannerpoint"
mod.issues_url = "https://github.com/pajicadvance/bannerpoint/issues"
mod.discord_url = "https://discord.gg/5RkzS66zWb"

# publishing
publish.modrinth = "IfTBNyjQ"
publish.curseforge = "1540780"
publish.env.mr = "SERVER_ONLY_CLIENT_OPTIONAL" #https://modmuss50.github.io/mod-publish-plugin/platforms/modrinth/#all-options
publish.env.cf.client = false
publish.env.cf.server = true
publish.dry_run = false

# loom
loomx.loom_version = "1.17-SNAPSHOT"

# dependencies
loader.fabric = "0.19.5"
dep.fzzy_config.coords = "me.fzzyhmstrs:$id:$version"
dep.fzzy_config.slug = "fzzy-config"
dep.sodium.coords = "net.caffeinemc:$id-$loader:$version"
dev.runtime_optionals = []

[fabric]
dep.fabric-api.coords = "net.fabricmc.fabric-api:$id:$version"
dep.modmenu.coords = "com.terraformersmc:$id:$version"

[neoforge]


["1.21.1"]
mod.mc_releases = ["1.21", "1.21.1"]
loader.neo = "21.1.250"
runtime.sodium = "0.8.13+mc1.21.1"

[fabric."1.21.1"]
mod.mc_compat = ">=1.21 <=1.21.1"
required.fabric-api = "0.116.17+1.21.1"
required.fzzy_config = "0.7.6+1.21"
runtime.modmenu = "11.0.4"

[neoforge."1.21.1"]
mod.mc_compat = "[1.21, 1.21.1]"
required.fzzy_config = "0.7.6+1.21+neoforge"


["26.1"]
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]
loader.neo = "26.1.2.107"
runtime.sodium = "0.9.2+mc26.1.2"

[fabric."26.1"]
mod.mc_compat = "~26.1"
required.fabric-api = "0.155.3+26.1.2"
required.fzzy_config = "0.7.6+26.1-pre-3"
runtime.modmenu = "18.0.0"

[neoforge."26.1"]
mod.mc_compat = "[26.1, 26.2)"
required.fzzy_config = "0.7.6+26.1-pre-3+neoforge"


["26.2"]
mod.mc_releases = ["26.2"]
loader.neo = "26.2.0.82"
runtime.sodium = "0.9.2+mc26.2"

[fabric."26.2"]
mod.mc_compat = "~26.2"
required.fabric-api = "0.160.0+26.2"
required.fzzy_config = "0.7.6+26.2-pre-3"
runtime.modmenu = "20.0.1"

[neoforge."26.2"]
mod.mc_compat = "[26.2, 26.3)"
required.fzzy_config = "0.7.6+26.2+neoforge"


["26.3"]
mod.mc_releases = ["26.3"]
#loader.neo = "26.2.0.36-beta"
runtime.sodium = "0.9.2+mc26.3"

[fabric."26.3"]
mod.mc_compat = "~26.3"
